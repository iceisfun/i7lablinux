      else { let txt = ''; await runStream('logs', ['--' + src, '-n', '400'], ev => { if (ev.event === 'stdout') txt += I7.decodeStdout(ev); }, { signal: sig }); lines = textToLines(txt); }

  };
  srcSel.addEventListener('change', () => { src = srcSel.value; lines = []; draw(); fetchLog(); });
  lvl.addEventListener('change', () => { f.level = Number(lvl.value); draw(); });
  q.addEventListener('input', () => { f.q = q.value; draw(); });
  fol.addEventListener('change', () => { follow = fol.checked; draw(); });
  pau.addEventListener('click', () => { paused = !paused; pau.setAttribute('aria-pressed', String(paused)); pau.textContent = paused ? 'Resume' : 'Pause'; });
  dl.addEventListener('click', () => { const u = URL.createObjectURL(new Blob([I7.logFilter(lines, f).map(l => I7.clean(l.text)).join('\n') + '\n'], { type: 'text/plain' })); const a = h('a', { href: u, download: 'i7lab-' + src + '.log' }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000); });
  return poll(fetchLog, 3000);
};

/* ---------- Terminal: xterm.js (vendored, served by this host) on a PTY over signed HTTP ----------
   POST shell/open -> id; GET shell/<id>/out is a sealed SSE stream (every event mac-checked like all streams);
   keystrokes go out as signed POST shell/<id>/in (base64 body), one request at a time so order is kept. */
const loaded = {};
function loadScript(src) {
  return new Promise((res, rej) => {
    if (loaded[src]) { res(); return; }
    const e = document.createElement('script'); e.src = src;
    e.onload = () => { loaded[src] = true; res(); }; e.onerror = () => rej(new Error('cannot load ' + src + ' from this host'));
    document.head.append(e);
  });
}
function loadCss(href) {
  if (loaded[href]) return; loaded[href] = true;
  document.head.append(h('link', { rel: 'stylesheet', href }));
}
pages.terminal = function (root, sig) {
  const isAdmin = !!S.admin;
  const status = h('span', { class: 'dim', role: 'status', 'aria-live': 'polite' });
  const openBtn = h('button', { type: 'button', class: 'pri', id: 'termopen', disabled: !isAdmin }, 'Open shell');
  const closeBtn = h('button', { type: 'button', id: 'termclose', disabled: true }, 'Close shell');
  const box = h('div', { class: 'term-box', id: 'termbox', hidden: true });
  root.append(pageShell('Terminal'),
    h('div', { class: 'alert bad', id: 'termwarn', role: 'note' }, h('strong', null, 'Unencrypted HTTP: '), 'everything you type and see is visible on the network; use only on a trusted LAN.'),
    isAdmin ? null : h('div', { class: 'alert warn', id: 'termdeny' }, h('strong', null, 'Admin key required. '), 'A shell can run anything on this host, so only the admin key may open one. This page is signed with the read-only key. Load the admin key on the ',
      h('a', { href: '#/actions' }, 'Actions page'), ' to enable the terminal.'),
    h('div', { class: 'row', style: 'margin:8px 0' }, openBtn, closeBtn, status),
    h('p', { class: 'dim' }, 'Runs i7labsh on a pty. Limits: 2 shells at a time, closed after 10 minutes without typing, and when you leave this page. Everything is audited.'),
    box);
  let sh = null;
  const fireClose = s => { if (s.closing) return; s.closing = true; api('POST', '/api/v1/shell/' + s.id + '/close', { admin: true }).catch(() => { /* gone already */ }); };
  const end = (s, why) => {
    if (s.dead) return; s.dead = true;
    try { s.term.write('\r\n\x1b[33m[session ended: ' + why + ']\x1b[0m\r\n'); } catch (e) { /* disposed */ }
    s.ctl.abort(); status.textContent = 'session ended (' + why + ')'; openBtn.disabled = !S.admin; closeBtn.disabled = true; if (sh === s) sh = null;
  };
  const pump = async s => {
    if (s.sending || s.dead) return; s.sending = true;
    try {
      while (s.q.length && !s.dead) {
        const piece = I7.chunkStr(s.q, 4096)[0]; s.q = s.q.slice(piece.length);
        await api('POST', '/api/v1/shell/' + s.id + '/in', { admin: true, body: I7.toB64(I7.utf8(piece)), signal: s.ctl.signal });
      }
    } catch (e) { if (e.name !== 'AbortError') end(s, 'input failed: ' + (e.message || e)); }
    s.sending = false;
  };
  let rt = null;
  const sendSize = s => { clearTimeout(rt); rt = setTimeout(() => { if (!s.dead) api('POST', '/api/v1/shell/' + s.id + '/resize?cols=' + s.term.cols + '&rows=' + s.term.rows, { admin: true, signal: s.ctl.signal }).catch(() => { /* next resize retries */ }); }, 150); };
  const begin = async () => {
    if (sh || !S.admin) return;
    openBtn.disabled = true; status.textContent = 'starting...';
    let term;
    try {
      loadCss('/vendor/xterm.css'); await loadScript('/vendor/xterm.js'); await loadScript('/vendor/addon-fit.js');
      term = new Terminal({ cursorBlink: true, fontFamily: 'ui-monospace, Menlo, Consolas, monospace', fontSize: 14, scrollback: 2000, theme: { background: '#0f1216', foreground: '#e4e7ec' } });
      const fit = new FitAddon.FitAddon(); term.loadAddon(fit);
      box.hidden = false; term.open(box); fit.fit();
      const r = await api('POST', '/api/v1/shell/open?cols=' + term.cols + '&rows=' + term.rows, { admin: true, signal: sig });
      const s = sh = { id: r.id, term, fit, ctl: new AbortController(), q: '', sending: false, dead: false, closing: false };
      closeBtn.disabled = false; status.textContent = 'connected (shell ' + t(r.id.slice(0, 8)) + ')';
      term.onData(d => { s.q += d; pump(s); });
      term.onResize(() => sendSize(s));
      if (window.ResizeObserver) { const ro = new ResizeObserver(() => { try { fit.fit(); } catch (e) { /* hidden */ } }); ro.observe(box); s.ro = ro; }
      term.focus();
      stream('GET', '/api/v1/shell/' + s.id + '/out', { sse: true, admin: true, signal: s.ctl.signal, onEvent: ev => {
        if (ev.event === 'out' && typeof ev.b64 === 'string') term.write(I7.fromB64(ev.b64));
        else if (ev.event === 'exit') end(s, ev.reason === 'exit' ? 'shell exited' + (ev.code != null ? ' with status ' + ev.code : '') : ev.reason === 'idle' ? 'idle for 10 minutes' : String(ev.reason));
      } }).then(() => end(s, 'connection closed')).catch(e => { if (e.name !== 'AbortError') end(s, e.message || String(e)); });
    } catch (e) {
      if (e.name === 'AbortError') return;
      status.textContent = ''; openBtn.disabled = !S.admin; if (term) { try { term.dispose(); } catch (x) { /* ignore */ } } box.hidden = true;
      addKids(root, errBox(e, () => { route(); }));
    }
  };
  openBtn.addEventListener('click', begin);
  closeBtn.addEventListener('click', () => { if (sh) { fireClose(sh); end(sh, 'closed by you'); } });
  return () => { if (sh) { const s = sh; fireClose(s); s.dead = true; if (s.ro) s.ro.disconnect(); try { s.term.dispose(); } catch (e) { /* ignore */ } } };
};

  { cmd: 'time.set', title: 'Set host clock', desc: 'Sets the host time from this browser clock.', admin: true, fields: [], dyn: () => [String(Math.floor(Date.now() / 1000))] },
  { cmd: 'tui', title: 'Console tab', desc: 'Switch the console TUI tab.', admin: true, fields: [{ n: 'name', label: 'Tab', def: 'overview', pos: true, pre: ['tab'] }], extra: [{ label: 'Reset', args: ['reset'] }] },

];
pages.actions = function (root, sig) {
  const adminIn = h('input', { type: 'password', id: 'adm', autocomplete: 'off', spellcheck: 'false', placeholder: 'i7k1:admin:...', style: 'width:min(100%,520px)' });

  const grid = h('div', { class: 'grid' });

  const adminCard = h('section', { class: 'card wide' }, h('h2', null, 'Admin key'), h('p', { class: 'dim' }, 'The SPA signs reads with the read-only key. Load the admin key only when you need to change something; it stays in this tab (sessionStorage) and is never sent to the host, only HMACs are.'),
    h('div', { class: 'row' }, h('label', { for: 'adm' }, 'Admin key line'), adminIn, h('button', { type: 'button', class: 'pri', onclick: loadAdmin }, 'Load admin key'), h('button', { type: 'button', onclick: forget }, 'Forget admin key')), adminMsg);
  root.append(pageShell('Actions'), adminCard, grid);

    setKids(grid, ...ACTIONS.map(a => {
      const avail = !S.cmds || S.cmds.has(a.cmd), vals = {}, res = h('div', { 'aria-live': 'polite' });

        !avail ? h('p', null, badge('not available on this host', 'warn')) : (a.admin && !S.admin ? h('p', { class: 'dim' }, 'Load the admin key above to enable.') : null),
        h('div', { class: 'row' }, inputs, chk), h('div', { class: 'row', style: 'margin-top:8px' }, h('button', { type: 'button', class: a.danger ? 'danger' : 'pri', disabled: dis, onclick: () => go() }, a.title),
          (a.extra || []).map(x => h('button', { type: 'button', disabled: dis, onclick: () => go(x.args) }, x.label))), res);
    }));

};

pages.about = function (root, sig) {
  const body = h('div'); root.append(pageShell('About'), body);
  Promise.all([cmd('id', [], { signal: sig }), cmd('cmds', [], { signal: sig })]).then(([id, cm]) => {
    const keys = [['Read-only key', S.ro], ['Admin key', S.admin]].map(([n, k]) => [n, k ? k.role + ' ' + k.id : 'not loaded']);
    S.exp = () => ({ page: 'About', sections: I7.expAbout(id, cm, keys, S.stats) });
    setKids(body, h('div', { class: 'grid' },
      card('Agent', kv([['Version', id.version], ['Build', id.build], ['Hostname', id.hostname], ['Boot id', id.boot_id], ['State', id.state], ['Your role', id.role], ['Host keys', id.kid], ['Protocol', String(id.proto)]])),
      card('This session', kv(keys.concat([['Verified responses/events', String(S.stats.ok)], ['Failed verification', String(S.stats.bad)], ['Page', 'single file; xterm.js is fetched from this host only when the Terminal tab is opened']]))),
      card('API', h('p', null, 'Everything here uses the signed JSON API; see ', h('a', { href: '/api/v1/openapi.json' }, 'openapi.json'), ' (open). Requests are authenticated and the host proves itself, but nothing is encrypted (no TLS in v0.x).'),
        h('p', { class: 'dim' }, 'Command line: i7labctl --http HOST CMD ... or i7labctl --ether MAC --cmd CMD (no IP needed).')),
      h('section', { class: 'card wide' }, h('h2', null, 'Commands'), table(['Name', 'Access', 'Streams', 'Usage', 'Summary'], (cm.commands || []).map(c => [c.name + (c.planned ? ' (planned' + (c.since ? ' ' + c.since : '') + ')' : ''), c.access, c.streams ? 'yes' : '', c.usage, c.summary])))));
  }).catch(e => { if (e.name !== 'AbortError') setKids(body, errBox(e)); });

/* ---------- login, header, router ---------- */
function whoami() {
  const w = $('#whoami'); w.textContent = '';
  const k = S.admin || S.ro;
  if (k) w.append(badge((S.admin ? 'admin' : 'read-only') + ' ' + k.id, S.admin ? 'warn' : 'ok'));
  $('#signout').hidden = !k;
  $('#hostname').textContent = S.hello && S.hello.hostname ? t(S.hello.hostname) : '';
  document.title = 'i7lablinux' + (S.hello && S.hello.hostname ? ' ' + t(S.hello.hostname) : '');
}
function loginPage(root) {
  const ta = h('input', { type: 'password', id: 'keyline', autocomplete: 'off', spellcheck: 'false', placeholder: 'i7k1:ro:...', style: 'width:100%' }), msg = h('div', { 'aria-live': 'polite' });
  const enter = async (k) => {
    S.ro = k.role === 'ro' ? k : S.ro; if (k.role === 'admin') S.admin = k;
    try { const r = await cmd('id', []); saveKey(k); S.hello = Object.assign({}, S.hello, { hostname: r.hostname }); whoami(); location.hash = '#/overview'; route(); }
    catch (e) { if (k.role === 'ro') S.ro = null; else S.admin = null; setKids(msg, errBox(e)); }
  };
  const go = () => { const k = I7.parseKey(ta.value); if (!k) { setKids(msg, h('div', { class: 'alert bad' }, 'A key line looks like i7k1:ro:<64 hex characters>.')); return; } enter(k); };
  ta.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  root.append(h('div', { class: 'login' }, h('h1', null, 'Connect to ' + t(S.hello && S.hello.hostname || 'this host')),
    S.hello && S.hello.error ? h('div', { class: 'alert bad' }, 'Cannot reach the agent: ' + t(S.hello.error)) : null,
    h('p', null, 'Paste a key line. Use the read-only key (', h('code', null, 'i7k1:ro:...'), ') for looking around; the admin key is loaded later, on the Actions page. Keys live only in this tab and are never sent over the network.'),
    h('label', { for: 'keyline' }, 'Key line'), ta, h('div', { class: 'row', style: 'margin-top:8px' }, h('button', { type: 'button', class: 'pri', onclick: go }, 'Connect')),
    msg, h('p', { class: 'dim' }, 'Keys are in ~/.config/i7labctl/keys/ on the machine that built the stick (docs/KEYS.md).')));
  ta.focus();
}
let routeSeq = 0;
function route() {
  if (S.cleanup) { try { S.cleanup(); } catch (e) { /* ignore */ } S.cleanup = null; }
  if (S.ctl) S.ctl.abort();
  S.exp = null;
  S.ctl = new AbortController(); const sig = S.ctl.signal, seq = ++routeSeq;
  const name = (location.hash.replace(/^#\/?/, '') || 'overview').split('?')[0];
  const root = $('#main'); root.replaceChildren();
  const nav = $('#nav'); nav.replaceChildren(...PAGES.map(([id, label]) => h('a', { href: '#/' + id, 'aria-current': id === name ? 'page' : null }, label)));
  if (!S.ro && !S.admin) { nav.hidden = true; loginPage(root); return; }
  nav.hidden = false;
  const fn = pages[name] || pages.overview;
  const r = fn(root, sig); if (seq === routeSeq) S.cleanup = typeof r === 'function' ? r : null;
  root.focus({ preventScroll: true }); window.scrollTo(0, 0);
}
function applyTheme(m) { if (m === 'light' || m === 'dark') document.documentElement.setAttribute('data-theme', m); else document.documentElement.removeAttribute('data-theme'); }
async function start() {
  applyTheme(lsGet('i7lab.theme'));
  $('#themebtn').addEventListener('click', () => { const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); const nx = cur === 'dark' ? 'light' : 'dark'; applyTheme(nx); lsSet('i7lab.theme', nx); });
  $('#signout').addEventListener('click', () => { forgetKeys(); whoami(); route(); });
  loadKeys();
  try { const r = await fetch('/api/v1/hello', { cache: 'no-store' }); S.hello = r.ok ? await r.json() : { error: 'HTTP ' + r.status }; setConn(r.ok ? 'ok' : 'bad', r.ok ? 'host reachable' : 'host error'); }
  catch (e) { S.hello = { error: String(e.message || e) }; setConn('bad', 'unreachable'); }
  whoami(); window.addEventListener('hashchange', route); route();
  window.addEventListener('online', () => setConn('warn', 'back online'));
}
window.addEventListener('unhandledrejection', ev => { const e = ev.reason; if (e && e.name !== 'AbortError') toast('Unexpected error: ' + (e.message || e), 'bad'); });
start();
})();
