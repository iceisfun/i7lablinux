[workspace]
resolver = "2"
members = [
    "crates/labproto",
    "crates/labprobe",
    "crates/labtui",
    "crates/i7labd",
    "crates/i7lab-init",
    "crates/i7labsh",
    "crates/i7labctl",
    "crates/i7labwr",
    "crates/i7oracled",
]
# i7oracled is a WINDOWS daemon (cross-built for x86_64-pc-windows-gnu, docs/ORACLED.md). It is a workspace
# member (shared lockfile, `cargo build -p i7oracled --target x86_64-pc-windows-gnu`) but not a default member,
# so a plain `cargo build` / `cargo test` in the workspace root skips it. It still compiles on Linux (pure logic
# + stubs) when selected with --workspace or -p.
default-members = [
    "crates/labproto",
    "crates/labprobe",
    "crates/labtui",
    "crates/i7labd",
    "crates/i7lab-init",
    "crates/i7labsh",
    "crates/i7labctl",
    "crates/i7labwr",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT"

# No external dependencies anywhere in this workspace (std + hand-written libc FFI only).
[workspace.dependencies]
labproto = { path = "crates/labproto" }
labprobe = { path = "crates/labprobe" }
labtui = { path = "crates/labtui" }
i7labsh = { path = "crates/i7labsh" }

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"      # PID 1 and i7labd catch panics per duty
opt-level = "s"
lto = true
codegen-units = 1
strip = true
