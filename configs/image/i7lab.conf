# Baked i7labd defaults (key = value). Kernel args i7lab.<key>=<value> override them.
# http = 80       primary HTTP port (advertised in the beacon); http_alt = 8080 stays for older clients
# http_alt = 8080   (off to disable). Explicit i7lab.http=PORT on the cmdline drops the alt unless http_alt is also given.
beacon_compat = 1
# Unauthenticated I7LR1 hints: off (review F6). I7LR2 (HMAC) hints are always accepted.
accept_v1_hint = 0
# ether = all | IFACE,IFACE   (listen set of the ether server; i7lab.ether= on the cmdline)
ether = all
# http_bind = all | IFACE | A.B.C.D
http_bind = all
ether_deny =
console = open
